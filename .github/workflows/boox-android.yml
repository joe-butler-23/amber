name: BOOX Android

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - name: Install Android NDK
        run: |
          sdkmanager "ndk;27.0.12077973"
          echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/27.0.12077973" >> "$GITHUB_ENV"
          echo "$ANDROID_SDK_ROOT/ndk/27.0.12077973/toolchains/llvm/prebuilt/linux-x86_64/bin" >> "$GITHUB_PATH"
      - uses: taiki-e/install-action@v2
        with:
          tool: protoc
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: npm ci
      - name: Configure Android signing
        env:
          KEY_BASE64: ${{ secrets.ANDROID_KEY_BASE64 }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          umask 077
          test -n "$KEY_BASE64" && test -n "$KEY_ALIAS" && test -n "$KEY_PASSWORD"
          printf '%s' "$KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/amber-keystore.jks"
          printf 'keyAlias=%s\npassword=%s\nstoreFile=%s\n' \
            "$KEY_ALIAS" "$KEY_PASSWORD" "$RUNNER_TEMP/amber-keystore.jks" \
            > src-tauri/gen/android/keystore.properties
      - name: Build arm64 APK
        run: npm run android:build -- --apk --target aarch64
      - name: Verify and identify APK
        run: |
          mkdir apk
          cp src-tauri/gen/android/app/build/outputs/apk/universal/release/*.apk apk/Amber-boox-arm64.apk
          tools=$(find "$ANDROID_SDK_ROOT/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)
          "$tools/apksigner" verify --verbose --print-certs apk/Amber-boox-arm64.apk | tee apk/signing-certificate.txt
          printf 'repository=%s\ncommit=%s\nrun=%s\n' \
            "$GITHUB_REPOSITORY" "$GITHUB_SHA" "$GITHUB_RUN_ID" > apk/build-info.txt
          cd apk
          sha256sum Amber-boox-arm64.apk > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: Amber-boox-arm64-${{ github.sha }}
          path: apk/
          if-no-files-found: error
          retention-days: 30
      - name: Remove runner signing files
        if: always()
        run: rm -f "$RUNNER_TEMP/amber-keystore.jks" src-tauri/gen/android/keystore.properties
